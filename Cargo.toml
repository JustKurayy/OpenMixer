[package]
name = "openmixer"
version = "0.1.0"
edition = "2024"
description = "A small cross-platform mixer for monitoring and cleaning line input"
license = "GPL-3.0-only"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
ringbuf = "0.6.0"
rustfft = "6.4.1"

[profile.release]
lto = "thin"
strip = true

