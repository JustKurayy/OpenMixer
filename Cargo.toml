[package]
name = "openmixer"
version = "0.3.5"
edition = "2024"
description = "A small cross-platform mixer for monitoring and cleaning line input"
license = "GPL-3.0-only"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
getrandom = "0.3"
ringbuf = "0.6.0"
rustfft = "6.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3.5.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
strip = true

